# JARVIS configuration
#
# This file is the single source of truth for runtime settings.
# Unknown keys are rejected on purpose so typos fail fast.

[app]
name = "JARVIS"
log_level = "INFO"
# Relative paths are resolved against the project root.
log_dir = "logs"

[llama]
# llama-server.exe from the existing llama.cpp installation (found on PATH).
executable = "llama-server"
model_path = "models/Llama-3.2-1B-Instruct-Q4_K_M.gguf"
host = "127.0.0.1"
port = 8080
# Starting values from the specification; benchmark before increasing.
context_size = 2048
threads = 2
threads_batch = 2
batch_size = 64
ubatch_size = 64
parallel_slots = 1
gpu_layers = 0
# Seconds to wait for /health after launching the server.
startup_timeout_s = 120.0
# Reuse an already running server on this port instead of launching one.
auto_start = true

[llm]
connect_timeout_s = 5.0
# Read timeout must exceed the slowest measured prefill (31.9 s for 301
# tokens) plus generation time on this CPU.
read_timeout_s = 120.0
max_tokens = 50
temperature = 0.2
max_retries = 1

[tts]
enabled = true
rate = 175
volume = 1.0
# Empty string = Windows default voice. An installed SAPI voice id may be used.
voice = ""

[voice]
# Offline voice interface: Vosk small English model plus WebRTC VAD.
# Set enabled = false (or run with --text) for a keyboard-only session.
enabled = true
# Empty string = system default microphone; otherwise a name substring.
input_device = ""
# Global push-to-talk hotkey. Enter on an empty console line also records.
ptt_key = "ctrl+space"
# 0 = permissive with noise, 3 = aggressive noise rejection.
vad_aggressiveness = 2
# Trailing silence that ends a request. Too short a value cuts the request
# at the first natural pause, which produces fragmented transcripts.
silence_ms = 1200
min_speech_ms = 250
# Long spoken requests are cut at this length; 20s fits a full sentence.
max_record_s = 20.0
# Vosk model directory; relative paths resolve against the project root.
# Measured on this machine: vosk-model-en-us-0.22-lgraph (204 MB) needs
# 396 MB of the Python process (total 1305 MB, over the 1.3 GB target) and
# decodes in ~10 s per request instead of ~2 s, without better accuracy, so
# the small model stays the default. Any Vosk model folder can be used here;
# if it is missing, the largest models/vosk-model-* is loaded instead.
stt_model = "models/vosk-model-small-en-us-0.15"

[conversation]
# Multi-turn context: recent exchanges are sent with every request; older ones
# are compressed into a short summary instead of silently dropped.
enabled = true
# Default answer style: short, detailed or technical (change with /mode).
mode = "short"
# Verbatim exchanges kept in context, and when older ones get summarized.
max_turns = 8
summarize_after = 12
# Character budget for the messages sent to the model (context is 2048 tokens).
max_context_chars = 3500
# Per-mode reply limits; this CPU generates roughly 5-10 tokens per second.
# They are sized so an answer finishes instead of being cut mid-sentence.
short_max_tokens = 90
detailed_max_tokens = 250
technical_max_tokens = 320
# When a reply still hits the limit, ask the model to continue once.
max_continuations = 1
# Load the most recent saved session at startup so context survives a restart.
resume_last_session = true
# SQLite file for persisted exchanges (git-ignored).
history_db = "data/jarvis.db"

[weather]
# Current conditions and today's range through Open-Meteo (no API key).
enabled = true
# metric = Celsius and km/h, imperial = Fahrenheit and mph.
units = "metric"
# Used when a question names no city; empty asks which city instead.
default_location = ""
timeout_s = 10.0

[memory]
# Explicit memories plus a small set of high-confidence learned statements.
# The conversation itself is never saved wholesale as permanent memory.
enabled = true
db = "data/jarvis.db"
# Saved memories included in the system prompt (ranked by relevance).
inject_items = 6
# Learn stable first-person facts (name, preferences, work, folders) from
# ordinary sentences. Questions and commands are ignored.
auto_learn = true
learn_min_confidence = 0.75
# Learned semantic memories expire; explicit memories do not.
learned_ttl_days = 180
# Episodic summaries of substantive exchanges and the session context size.
episodic_ttl_days = 30
episodic_items = 200
short_term_items = 6

[tools]
# Computer interaction tools: files, applications, system info, clipboard,
# windows, screenshots and notifications.
enabled = true
# File tools may only read or write inside this folder (relative to project).
# Point this at your Desktop (for example "C:/Users/ADMIN/Desktop") to let
# JARVIS create and edit files there instead of inside the project.
root = "."
max_read_bytes = 200000
search_limit = 20
max_search_depth = 4
command_timeout_s = 15.0
# Applications JARVIS may open or close.
allowed_apps = ["notepad", "calc", "mspaint", "explorer", "msedge", "chrome", "code"]
# Terminal commands JARVIS may run; arguments are validated, never shelled.
allowed_commands = ["ipconfig", "whoami", "systeminfo", "tasklist", "hostname", "ping"]

[tasks]
# Durable multi-step plans with approval, checkpoints, retries and history.
# Task tables share the conversation database.
enabled = true
db = "data/jarvis.db"
# A plan may not exceed this many executable steps. The default handles
# folders of roughly 2,500 files; larger folders should be split.
max_steps = 5000
# Retries per step when the plan does not set its own value.
max_retries = 1
retry_delay_s = 0.2
# Independent steps marked parallel run through this many workers.
parallel_workers = 2
# Destructive plans wait for /confirm before the first step runs.
approval_required = true
# Continue approved background plans after JARVIS restarts.
auto_resume = true
# Rows shown by /tasks history.
history_items = 20

[productivity]
# Local to-dos, deadlines and recurring tasks. These are separate from the
# durable multi-step execution plans in [tasks] and use /todo, not /tasks.
enabled = true
# To-do items share the assistant database but use their own table.
db = "data/jarvis.db"
default_priority = "normal"
# Upper bound for list and planning queries.
max_items = 2000

[notes]
# Local notes with FTS5 search. Notes share the assistant database but use
# their own tables, separate from to-dos, memories and conversation history.
enabled = true
db = "data/jarvis.db"
# Upper bound for list and fallback scan queries.
max_items = 5000
max_content_chars = 10000
search_limit = 10

[habits]
# Daily habits with check-in streaks and optional recurring reminders.
# Habits share the assistant database but use their own tables.
enabled = true
db = "data/jarvis.db"
# Upper bound for habit listing and reminder refresh.
max_habits = 200

[goals]
# Local goals with numeric progress and optional target dates.
# Goals share the assistant database but use their own table.
enabled = true
db = "data/jarvis.db"
max_goals = 500

[time]
# Local time tracking with one active entry and daily totals.
# Entries share the assistant database but use their own table.
enabled = true
db = "data/jarvis.db"
max_entries = 20000

[calendar]
# Local calendar events and daily agendas.
# Events share the assistant database but use their own table.
enabled = true
db = "data/jarvis.db"
max_events = 5000
default_duration_minutes = 60

[email]
# Local email drafts always work; searching and sending need an account.
# The password is read from this environment variable, never this file.
enabled = true
db = "data/jarvis.db"
max_drafts = 1000
from_address = ""
username = ""
password_env = "JARVIS_EMAIL_PASSWORD"
imap_host = ""
imap_port = 993
imap_ssl = true
smtp_host = ""
smtp_port = 587
smtp_ssl = false
smtp_starttls = true
mailbox = "INBOX"
search_limit = 10
timeout_s = 20.0
max_body_chars = 20000

[pomodoro]
# Work and break phases use the existing in-memory timer service.
enabled = true
# The active phase and due time are persisted here for restart recovery.
db = "data/jarvis.db"
work_minutes = 25
break_minutes = 5
long_break_minutes = 15
cycles_before_long_break = 4

[clipboard]
# Clipboard copies are stored locally with bounded count, size and age.
enabled = true
db = "data/jarvis.db"
max_items = 500
max_chars = 10000
retention_days = 30
search_limit = 10

[documents]
# Local document intelligence: PDF, DOCX, TXT, Markdown, CSV and XLSX.
# Text and tables stay on this machine; only retrieved passages are sent to
# the local model for question answering and explanations.
enabled = true
# Metadata and chunk index share the assistant database.
db = "data/jarvis.db"
# Reject files above this size instead of reading them into memory.
max_file_bytes = 20000000
# Cap extracted text per document to keep indexing bounded.
max_chars = 2000000
# Passage size and overlap for FTS5 retrieval (characters).
chunk_chars = 900
chunk_overlap = 120
# Passages shown by document search, and the evidence budget for answers.
search_limit = 5
context_chars = 4000
# Folder indexing limits.
max_files = 500
max_chunks = 20000
# Optional OCR for scanned PDF pages and image files (PNG, JPG, BMP, TIFF,
# WebP). Windows OCR runs locally and needs the matching Windows language
# pack. Pages are rendered at ocr_dpi; pages below ocr_min_chars are OCRed.
ocr_enabled = true
ocr_language = "en-US"
ocr_dpi = 200
ocr_min_chars = 40
# Bound OCR work per PDF. Additional scanned pages are skipped.
ocr_max_pages = 20

[web]
# Internet search and grounded answers. No API key is needed for DuckDuckGo.
enabled = true
# auto = Brave when BRAVE_API_KEY is set, otherwise DuckDuckGo.
provider = "auto"
# Optional self-hosted SearXNG instance (docker run searxng/searxng).
# When set, auto mode tries it before DuckDuckGo, which gives a stable
# alternative to scraped results. provider = "searxng" uses it alone.
searx_url = ""
# Results considered per query, and query variants sent to the provider.
max_results = 6
max_queries = 2
# Network timeout for a search or a page fetch.
timeout_s = 12.0
# Hard cap on downloaded bytes per page, and pages to read in full.
max_page_bytes = 400000
extract_pages = 3
# Character budget for the evidence given to the model (~250 tokens).
context_chars = 1000
# Search results are cached for an hour; stale entries still help offline.
cache_ttl_s = 3600
cache_entries = 128
cache_db = "data/search_cache.db"
# Read from the environment; never put the key itself in this file.
brave_api_key_env = "BRAVE_API_KEY"
